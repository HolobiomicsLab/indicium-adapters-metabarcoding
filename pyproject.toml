[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "indicium-adapters-metabarcoding"
version = "0.1.0"
description = "Metabarcoding DomainAdapter for the indicium ecosystem: EDAM-backed concept enrichment and classification vocabulary for amplicon marker-gene surveys"
readme = "README.md"
# 3.11, not the 3.12 the sibling adapters require: this one must be installable
# into the AgenticScienceBuilder conda environment (Python 3.11), which is where
# the classification vocabulary it feeds is consumed.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Louis-Felix Nothias", email = "louis-felix.nothias@cnrs.fr" }]
keywords = [
  "metabarcoding", "amplicon-sequencing", "16S", "ITS", "eDNA",
  "microbial-ecology", "taxonomy", "EDAM", "indicium", "ontology", "SSSOM",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["indicium-adapters>=0.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.entry-points."indicium.adapters"]
metabarcoding = "indicium_adapters_metabarcoding.metabarcoding:MetabarcodingAdapter"

[project.urls]
Homepage = "https://github.com/HolobiomicsLab/indicium-adapters-metabarcoding"
Repository = "https://github.com/HolobiomicsLab/indicium-adapters-metabarcoding"
Issues = "https://github.com/HolobiomicsLab/indicium-adapters-metabarcoding/issues"
Changelog = "https://github.com/HolobiomicsLab/indicium-adapters-metabarcoding/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/indicium_adapters_metabarcoding"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
